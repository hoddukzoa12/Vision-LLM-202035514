# 코드 스타일 검사 — 이름 규칙 (GUIDE.md §5)
# 로컬: ruff check .        CI: .github/workflows/lint.yml
# .py 와 .ipynb (노트북 셀) 모두 검사한다.

target-version = "py310"

[lint]
# N: pep8-naming
#   변수·함수·인자·모듈 = snake_case, 클래스 = PascalCase, 상수 = UPPER_SNAKE_CASE
select = ["N"]

[lint.pep8-naming]
# PyTorch / 머신러닝 관용 표기는 예외
#   import torch.nn.functional as F
#   X, X_train, X_test (입력 행렬)
extend-ignore-names = ["F", "X", "X_*"]
